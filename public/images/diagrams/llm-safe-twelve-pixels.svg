<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Illustrative diagram. Today: a component value of 12px is aliased to a token from an unrelated design decision that is also 12px; the token for the intended decision is also 12px but is not linked. It renders correctly. Later, a hypothetical change moves the unrelated token to 14px, and the component value moves with it, for no design reason.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a8a"/></marker>
  </defs>
  <rect width="1200" height="520" fill="#0b0d12"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="600" y="56" text-anchor="middle" fill="#e7e9ee" font-size="21" font-weight="700">Twelve pixels is not twelve pixels</text>

    <text x="80" y="112" fill="#9aa3b5" font-size="14" font-weight="700" letter-spacing="1">TODAY</text>
    <rect x="80" y="130" width="470" height="300" rx="14" fill="#161c28" stroke="#333c50" stroke-width="1.5"/>
    <rect x="110" y="160" width="190" height="70" rx="10" fill="#22293a" stroke="#4a5570"/>
    <text x="130" y="190" fill="#9aa3b5" font-size="13">component value</text>
    <text x="130" y="215" fill="#e7e9ee" font-size="19" font-weight="600">12px</text>
    <rect x="330" y="160" width="190" height="70" rx="10" fill="#1c2230" stroke="#3a4256" stroke-dasharray="5 5"/>
    <text x="350" y="190" fill="#9aa3b5" font-size="13">intended decision</text>
    <text x="350" y="215" fill="#c6cad4" font-size="19" font-weight="600">12px</text>
    <text x="425" y="250" text-anchor="middle" fill="#7c8598" font-size="12">not linked</text>
    <line x1="205" y1="232" x2="205" y2="292" stroke="#d98a8a" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="218" y="268" fill="#d98a8a" font-size="13">aliased to</text>
    <rect x="110" y="296" width="240" height="70" rx="10" fill="#2a1c22" stroke="#8a4a55"/>
    <text x="130" y="326" fill="#d9a3a8" font-size="13">token from an unrelated decision</text>
    <text x="130" y="351" fill="#e7e9ee" font-size="19" font-weight="600">12px</text>
    <text x="110" y="404" fill="#9aa3b5" font-size="14">Renders correctly. Nothing looks wrong.</text>

    <text x="650" y="112" fill="#9aa3b5" font-size="14" font-weight="700" letter-spacing="1">AFTER AN UNRELATED CHANGE (HYPOTHETICAL)</text>
    <rect x="650" y="130" width="470" height="300" rx="14" fill="#161c28" stroke="#333c50" stroke-width="1.5"/>
    <rect x="680" y="160" width="190" height="70" rx="10" fill="#2a1c22" stroke="#8a4a55"/>
    <text x="700" y="190" fill="#d9a3a8" font-size="13">component value</text>
    <text x="700" y="215" fill="#e7e9ee" font-size="19" font-weight="600">14px</text>
    <rect x="900" y="160" width="190" height="70" rx="10" fill="#1c2230" stroke="#3a4256" stroke-dasharray="5 5"/>
    <text x="920" y="190" fill="#9aa3b5" font-size="13">intended decision</text>
    <text x="920" y="215" fill="#c6cad4" font-size="19" font-weight="600">12px</text>
    <line x1="775" y1="232" x2="775" y2="292" stroke="#d98a8a" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="788" y="268" fill="#d98a8a" font-size="13">still aliased to</text>
    <rect x="680" y="296" width="240" height="70" rx="10" fill="#2a1c22" stroke="#8a4a55"/>
    <text x="700" y="326" fill="#d9a3a8" font-size="13">token from an unrelated decision</text>
    <text x="700" y="351" fill="#e7e9ee" font-size="19" font-weight="600">12px → 14px</text>
    <text x="680" y="404" fill="#9aa3b5" font-size="14">The value moves with a decision it was never part of.</text>

    <text x="600" y="482" text-anchor="middle" fill="#7c8598" font-size="14">Equal values don't prove that one decision should alias another.</text>
  </g>
</svg>
