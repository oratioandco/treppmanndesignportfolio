<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Diagram: one token repository is built by Style Dictionary in CI and served by a token API. Android reads the API on launch, the web build pulls the same tokens into Storybook, Figma syncs through a plugin; the iOS redesign in development reads the same tokens, and so do the video and series detail views on connected TV.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="#0b0d12"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="40" y="250" width="190" height="100" rx="10" fill="#1c2230" stroke="#3a4256" stroke-width="1.5"/>
    <text x="135" y="290" text-anchor="middle" fill="#e7e9ee" font-size="19" font-weight="600">Token repo</text>
    <text x="135" y="315" text-anchor="middle" fill="#9aa3b5" font-size="14">DTCG JSON, 4 tiers</text>
    <line x1="230" y1="300" x2="288" y2="300" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="290" y="240" width="210" height="120" rx="10" fill="#22293a" stroke="#4a5570" stroke-width="1.5"/>
    <text x="395" y="282" text-anchor="middle" fill="#e7e9ee" font-size="19" font-weight="600">Style Dictionary</text>
    <text x="395" y="306" text-anchor="middle" fill="#9aa3b5" font-size="14">one build, per platform</text>
    <text x="395" y="328" text-anchor="middle" fill="#9aa3b5" font-size="14">CI, on every merge</text>
    <line x1="500" y1="300" x2="558" y2="300" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="560" y="250" width="170" height="100" rx="10" fill="#22293a" stroke="#4a5570" stroke-width="1.5"/>
    <text x="645" y="292" text-anchor="middle" fill="#e7e9ee" font-size="19" font-weight="600">Token API</text>
    <text x="645" y="316" text-anchor="middle" fill="#9aa3b5" font-size="14">live, versioned</text>
    <line x1="730" y1="280" x2="788" y2="128" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="790" y="88" width="370" height="80" rx="10" fill="#161c28" stroke="#333c50" stroke-width="1.5"/>
    <text x="810" y="123" fill="#e7e9ee" font-size="17" font-weight="600">Android</text>
    <text x="810" y="146" fill="#7c8598" font-size="13">reads the API on launch, stores tokens locally</text>
    <line x1="730" y1="290" x2="788" y2="224" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="790" y="184" width="370" height="80" rx="10" fill="#161c28" stroke="#333c50" stroke-width="1.5"/>
    <text x="810" y="219" fill="#e7e9ee" font-size="17" font-weight="600">Web — Storybook</text>
    <text x="810" y="242" fill="#7c8598" font-size="13">the build pulls the same tokens</text>
    <line x1="730" y1="300" x2="788" y2="320" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="790" y="280" width="370" height="80" rx="10" fill="#161c28" stroke="#333c50" stroke-width="1.5"/>
    <text x="810" y="315" fill="#e7e9ee" font-size="17" font-weight="600">Figma — plugin sync</text>
    <text x="810" y="338" fill="#7c8598" font-size="13">design reads the same values it ships</text>
    <line x1="730" y1="310" x2="788" y2="416" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="790" y="376" width="370" height="80" rx="10" fill="#161c28" stroke="#333c50" stroke-width="1.5"/>
    <text x="810" y="411" fill="#e7e9ee" font-size="17" font-weight="600">iOS</text>
    <text x="810" y="434" fill="#7c8598" font-size="13">the redesign in development reads the same tokens</text>
    <line x1="730" y1="320" x2="788" y2="512" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="790" y="472" width="370" height="80" rx="10" fill="#161c28" stroke="#333c50" stroke-width="1.5"/>
    <text x="810" y="507" fill="#e7e9ee" font-size="17" font-weight="600">Connected TV</text>
    <text x="810" y="530" fill="#7c8598" font-size="13">video and series detail views read the same tokens</text>
    <text x="600" y="38" text-anchor="middle" fill="#c6cad4" font-size="15">One decision, changed once. Every platform on the API reads the same build; nothing to keep in sync by hand.</text>
  </g>
</svg>
