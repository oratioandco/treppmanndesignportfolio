<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Diagram: one token repository is built by Style Dictionary in CI and served by a token API. Android reads the API on launch, the web build pulls the same tokens into Storybook, and Figma syncs through a plugin. iOS and connected TV are drawn dashed: reaching them is an implementation task, not a system change.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="#0b0d12"/>

  <g font-family="Helvetica, Arial, sans-serif">
    <!-- source -->
    <rect x="40" y="250" width="190" height="100" rx="10" fill="#1c2230" stroke="#3a4256" stroke-width="1.5"/>
    <text x="135" y="290" text-anchor="middle" fill="#e7e9ee" font-size="19" font-weight="600">Token repo</text>
    <text x="135" y="315" text-anchor="middle" fill="#9aa3b5" font-size="14">DTCG JSON, 4 tiers</text>
    <line x1="230" y1="300" x2="288" y2="300" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- build -->
    <rect x="290" y="240" width="210" height="120" rx="10" fill="#22293a" stroke="#4a5570" stroke-width="1.5"/>
    <text x="395" y="282" text-anchor="middle" fill="#e7e9ee" font-size="19" font-weight="600">Style Dictionary</text>
    <text x="395" y="306" text-anchor="middle" fill="#9aa3b5" font-size="14">one build, per platform</text>
    <text x="395" y="328" text-anchor="middle" fill="#9aa3b5" font-size="14">CI, on every merge</text>
    <line x1="500" y1="300" x2="558" y2="300" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- api -->
    <rect x="560" y="250" width="170" height="100" rx="10" fill="#22293a" stroke="#4a5570" stroke-width="1.5"/>
    <text x="645" y="292" text-anchor="middle" fill="#e7e9ee" font-size="19" font-weight="600">Token API</text>
    <text x="645" y="316" text-anchor="middle" fill="#9aa3b5" font-size="14">live, versioned</text>

    <!-- live consumers -->
    <line x1="730" y1="280" x2="788" y2="110" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="730" y1="292" x2="788" y2="210" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="730" y1="304" x2="788" y2="310" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="790" y="70" width="370" height="80" rx="10" fill="#161c28" stroke="#333c50" stroke-width="1.5"/>
    <text x="810" y="105" fill="#e7e9ee" font-size="17" font-weight="600">Android</text>
    <text x="810" y="128" fill="#7c8598" font-size="13">reads the API on launch, stores tokens locally</text>

    <rect x="790" y="170" width="370" height="80" rx="10" fill="#161c28" stroke="#333c50" stroke-width="1.5"/>
    <text x="810" y="205" fill="#e7e9ee" font-size="17" font-weight="600">Web — Storybook</text>
    <text x="810" y="228" fill="#7c8598" font-size="13">the build pulls the same tokens</text>

    <rect x="790" y="270" width="370" height="80" rx="10" fill="#161c28" stroke="#333c50" stroke-width="1.5"/>
    <text x="810" y="305" fill="#e7e9ee" font-size="17" font-weight="600">Figma — plugin sync</text>
    <text x="810" y="328" fill="#7c8598" font-size="13">design reads the same values it ships</text>

    <!-- next -->
    <line x1="730" y1="318" x2="788" y2="420" stroke="#4a5060" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
    <line x1="730" y1="330" x2="788" y2="515" stroke="#4a5060" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>

    <rect x="790" y="385" width="370" height="70" rx="10" fill="none" stroke="#3a4256" stroke-width="1.5" stroke-dasharray="6 6"/>
    <text x="810" y="417" fill="#9aa3b5" font-size="17" font-weight="600">iOS</text>
    <text x="810" y="438" fill="#6b7385" font-size="13">next: an implementation task, not a system change</text>

    <rect x="790" y="480" width="370" height="70" rx="10" fill="none" stroke="#3a4256" stroke-width="1.5" stroke-dasharray="6 6"/>
    <text x="810" y="512" fill="#9aa3b5" font-size="17" font-weight="600">Connected TV</text>
    <text x="810" y="533" fill="#6b7385" font-size="13">next: an implementation task, not a system change</text>

    <text x="600" y="38" text-anchor="middle" fill="#c6cad4" font-size="15">One decision, changed once. Every platform on the API reads the same build; nothing to keep in sync by hand.</text>
  </g>
</svg>
