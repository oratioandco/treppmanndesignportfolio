<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Diagram: one token repository flows through Style Dictionary and out to Android, iOS, web and the Figma plugin. Four platforms consume the same source instead of drifting from a shared library reference.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#0b0d12"/>

  <!-- source -->
  <rect x="60" y="230" width="200" height="100" rx="10" fill="#1c2230" stroke="#3a4256" stroke-width="1.5"/>
  <text x="160" y="270" text-anchor="middle" fill="#e7e9ee" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="600">Token repo</text>
  <text x="160" y="295" text-anchor="middle" fill="#9aa3b5" font-family="Helvetica, Arial, sans-serif" font-size="14">DTCG JSON, 4 tiers</text>

  <line x1="260" y1="280" x2="358" y2="280" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- build step -->
  <rect x="360" y="220" width="230" height="120" rx="10" fill="#22293a" stroke="#4a5570" stroke-width="1.5"/>
  <text x="475" y="262" text-anchor="middle" fill="#e7e9ee" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="600">Style Dictionary</text>
  <text x="475" y="286" text-anchor="middle" fill="#9aa3b5" font-family="Helvetica, Arial, sans-serif" font-size="14">one build, per platform</text>
  <text x="475" y="308" text-anchor="middle" fill="#9aa3b5" font-family="Helvetica, Arial, sans-serif" font-size="14">CI, on every merge</text>

  <!-- four outputs -->
  <line x1="590" y1="260" x2="700" y2="120" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="272" x2="700" y2="235" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="288" x2="700" y2="335" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="300" x2="700" y2="450" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="700" y="80" width="440" height="80" rx="10" fill="#161c28" stroke="#333c50" stroke-width="1.5"/>
    <text x="720" y="115" fill="#e7e9ee" font-size="17" font-weight="600">Android — Kotlin values</text>
    <text x="720" y="138" fill="#7c8598" font-size="13">consumed at build time, not copied by hand</text>

    <rect x="700" y="195" width="440" height="80" rx="10" fill="#161c28" stroke="#333c50" stroke-width="1.5"/>
    <text x="720" y="230" fill="#e7e9ee" font-size="17" font-weight="600">iOS — Swift constants</text>
    <text x="720" y="253" fill="#7c8598" font-size="13">consumed at build time, not copied by hand</text>

    <rect x="700" y="310" width="440" height="80" rx="10" fill="#161c28" stroke="#333c50" stroke-width="1.5"/>
    <text x="720" y="345" fill="#e7e9ee" font-size="17" font-weight="600">Web / connected TV — CSS custom properties</text>
    <text x="720" y="368" fill="#7c8598" font-size="13">consumed at build time, not copied by hand</text>

    <rect x="700" y="425" width="440" height="80" rx="10" fill="#161c28" stroke="#333c50" stroke-width="1.5"/>
    <text x="720" y="460" fill="#e7e9ee" font-size="17" font-weight="600">Figma — plugin sync</text>
    <text x="720" y="483" fill="#7c8598" font-size="13">design reads the same values it ships</text>
  </g>

  <text x="600" y="40" text-anchor="middle" fill="#c6cad4" font-family="Helvetica, Arial, sans-serif" font-size="15">
    One decision, changed once. Four platforms and Figma read the same build — nothing to keep in sync by hand.
  </text>
</svg>
