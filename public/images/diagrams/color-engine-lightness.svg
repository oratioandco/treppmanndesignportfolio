<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Two range bars of OKLCH lightness for the dark card panels across fifteen artworks: imgix's panels span 0.16 to 0.57; the color engine's span 0.25 to 0.27.">
  <rect width="1200" height="400" fill="#0b0d12"/>
  <g font-family="Helvetica,Arial,sans-serif">
    <text x="600" y="62" text-anchor="middle" fill="#e7e9ee" font-size="23" font-weight="700">Lightness of the dark card panels, fifteen artworks</text>
    <text x="600" y="94" text-anchor="middle" fill="#9aa3b5" font-size="15">OKLCH lightness, darker on the left. Same card, same artworks.</text>
    <text x="60" y="173" fill="#c6cad4" font-size="18" font-weight="700">imgix palette extraction</text>
    <rect x="330" y="150" width="780" height="34" rx="6" fill="#343b49"/>
    <rect x="455" y="150" width="320" height="34" rx="4" fill="#7a8499"/>
    <text x="789" y="173" fill="#c6cad4" font-size="17">0.16 to 0.57</text>
    <text x="60" y="263" fill="#bde8cf" font-size="18" font-weight="700">The color engine</text>
    <rect x="330" y="240" width="780" height="34" rx="6" fill="#343b49"/>
    <rect x="525" y="240" width="16" height="34" rx="4" fill="#4f8f6b"/>
    <text x="555" y="263" fill="#bde8cf" font-size="17">0.25 to 0.27</text>
    <line x1="330" y1="320" x2="1110" y2="320" stroke="#667085" stroke-width="2"/>
    <line x1="330" y1="320" x2="330" y2="328" stroke="#667085" stroke-width="2"/><text x="330" y="350" text-anchor="middle" fill="#9aa3b5" font-size="14">0.00</text>
    <line x1="525" y1="320" x2="525" y2="328" stroke="#667085" stroke-width="2"/><text x="525" y="350" text-anchor="middle" fill="#9aa3b5" font-size="14">0.25</text>
    <line x1="720" y1="320" x2="720" y2="328" stroke="#667085" stroke-width="2"/><text x="720" y="350" text-anchor="middle" fill="#9aa3b5" font-size="14">0.50</text>
    <line x1="915" y1="320" x2="915" y2="328" stroke="#667085" stroke-width="2"/><text x="915" y="350" text-anchor="middle" fill="#9aa3b5" font-size="14">0.75</text>
    <line x1="1110" y1="320" x2="1110" y2="328" stroke="#667085" stroke-width="2"/><text x="1110" y="350" text-anchor="middle" fill="#9aa3b5" font-size="14">1.00</text>
  </g>
</svg>
