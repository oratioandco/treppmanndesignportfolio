<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Two-panel diagram. Before: designers received specs and shipped screens, with no user research, no design strategy, and no seat at the product table. After: exec-sponsored site visits to banks and insurers gave direct access to the analysts who used the product, and those insights shaped the roadmap.">
  <rect width="1200" height="520" fill="#0b0d12"/>

  <text x="600" y="52" text-anchor="middle" fill="#c6cad4" font-family="Helvetica, Arial, sans-serif" font-size="16">
    Five years, one design function
  </text>

  <!-- Before panel -->
  <text x="120" y="100" fill="#e7e9ee" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="600">Before</text>
  <rect x="120" y="118" width="440" height="300" rx="10" fill="#161c28" stroke="#333c50" stroke-width="1.5"/>

  <g font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#c6cad4">
    <rect x="148" y="152" width="10" height="10" rx="2" fill="#8a6b6b"/>
    <text x="170" y="162">Specs came in, screens went out</text>

    <rect x="148" y="196" width="10" height="10" rx="2" fill="#8a6b6b"/>
    <text x="170" y="206">No user research, no design strategy</text>

    <rect x="148" y="240" width="10" height="10" rx="2" fill="#8a6b6b"/>
    <text x="170" y="250">No seat at the product table</text>
  </g>
  <text x="148" y="390" fill="#7c8598" font-family="Helvetica, Arial, sans-serif" font-size="14">Execution only</text>

  <!-- Arrow -->
  <line x1="580" y1="268" x2="640" y2="268" stroke="#4a5570" stroke-width="1.5" stroke-dasharray="4 5"/>
  <polygon points="640,268 628,262 628,274" fill="#4a5570"/>
  <text x="610" y="248" text-anchor="middle" fill="#7c8598" font-family="Helvetica, Arial, sans-serif" font-size="13">5 yrs</text>

  <!-- After panel -->
  <text x="660" y="100" fill="#e7e9ee" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="600">After</text>
  <rect x="660" y="118" width="440" height="300" rx="10" fill="#161c28" stroke="#333c50" stroke-width="1.5"/>

  <g font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#c6cad4">
    <rect x="688" y="152" width="10" height="10" rx="2" fill="#4f8f6b"/>
    <text x="710" y="162">Exec-sponsored visits to banks and insurers</text>

    <rect x="688" y="196" width="10" height="10" rx="2" fill="#4f8f6b"/>
    <text x="710" y="206">Direct research with the analysts who used it</text>

    <rect x="688" y="240" width="10" height="10" rx="2" fill="#4f8f6b"/>
    <text x="710" y="250">Insights fed into the product roadmap</text>
  </g>
  <text x="688" y="390" fill="#8fd9b0" font-family="Helvetica, Arial, sans-serif" font-size="14">Strategic partner</text>
</svg>
