<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Diagram: a query against the full dataset returns real matches, but a preview built from a small sample can miss all of them and report zero — not a bug, a property of sampling itself.">
  <rect width="1200" height="520" fill="#0b0d12"/>

  <text x="600" y="52" text-anchor="middle" fill="#c6cad4" font-family="Helvetica, Arial, sans-serif" font-size="16">
    The same query, run two ways
  </text>

  <!-- Full dataset -->
  <text x="120" y="100" fill="#e7e9ee" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="600">Full dataset</text>
  <rect x="120" y="120" width="500" height="60" rx="6" fill="#161c28" stroke="#333c50" stroke-width="1.5"/>
  <!-- scattered matches across the full row -->
  <g fill="#4f8f6b">
    <rect x="145" y="132" width="10" height="36" rx="2"/>
    <rect x="210" y="132" width="10" height="36" rx="2"/>
    <rect x="260" y="132" width="10" height="36" rx="2"/>
    <rect x="330" y="132" width="10" height="36" rx="2"/>
    <rect x="395" y="132" width="10" height="36" rx="2"/>
    <rect x="450" y="132" width="10" height="36" rx="2"/>
    <rect x="530" y="132" width="10" height="36" rx="2"/>
    <rect x="580" y="132" width="10" height="36" rx="2"/>
  </g>
  <text x="120" y="205" fill="#7c8598" font-family="Helvetica, Arial, sans-serif" font-size="14">every row, matches scattered throughout</text>
  <text x="120" y="228" fill="#8fd9b0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600">Query result: matches found</text>

  <!-- 1% sample -->
  <text x="120" y="300" fill="#e7e9ee" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="600">A small sample</text>
  <rect x="120" y="320" width="500" height="60" rx="6" fill="#161c28" stroke="#333c50" stroke-width="1.5"/>
  <rect x="120" y="320" width="20" height="60" rx="0" fill="#22293a" stroke="#4a5570" stroke-width="1.5"/>
  <text x="130" y="410" fill="#7c8598" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">sample</text>
  <text x="120" y="428" fill="#7c8598" font-family="Helvetica, Arial, sans-serif" font-size="14">the sliver actually read — no matches happened to fall inside it</text>
  <text x="120" y="452" fill="#e0918f" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600">Preview result: nothing</text>

  <!-- arrow connecting concept -->
  <line x1="660" y1="150" x2="660" y2="350" stroke="#4a5570" stroke-width="1" stroke-dasharray="4 5"/>

  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="700" y="110" width="380" height="260" rx="10" fill="#1c2230" stroke="#3a4256" stroke-width="1.5"/>
    <text x="722" y="145" fill="#e7e9ee" font-size="17" font-weight="600">Not a bug</text>
    <text x="722" y="175" fill="#c6cad4" font-size="14">The data is real. The full query would find</text>
    <text x="722" y="196" fill="#c6cad4" font-size="14">it. A preview built from a small sample can</text>
    <text x="722" y="217" fill="#c6cad4" font-size="14">still miss every match by chance — that is</text>
    <text x="722" y="238" fill="#c6cad4" font-size="14">a property of sampling, not a failure.</text>
    <text x="722" y="270" fill="#e7e9ee" font-size="17" font-weight="600">The design problem</text>
    <text x="722" y="298" fill="#c6cad4" font-size="14">Users read an empty preview as "my data</text>
    <text x="722" y="319" fill="#c6cad4" font-size="14">is missing" and filed tickets. The interface</text>
    <text x="722" y="340" fill="#c6cad4" font-size="14">had to say "this is a sample" without</text>
    <text x="722" y="358" fill="#c6cad4" font-size="14">becoming unreadable.</text>
  </g>
</svg>
