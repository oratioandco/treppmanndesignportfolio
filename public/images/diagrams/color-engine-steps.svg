<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-label="The color engine in six steps: load the artwork, count the dominant colors, normalize in OKLCH, check contrast, fall back, return the theme.">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#667085"/></marker></defs>
  <rect width="1200" height="540" fill="#0b0d12"/>
  <g font-family="Helvetica,Arial,sans-serif">
    <text x="600" y="62" text-anchor="middle" fill="#e7e9ee" font-size="23" font-weight="700">From artwork to theme in six steps</text>
    <g transform="translate(40 120)">
      <rect width="340" height="160" rx="16" fill="#161c28" stroke="#333c50" stroke-width="2"/>
      <text x="26" y="42" fill="#8fd9b0" font-size="14" font-weight="700">01</text>
      <text x="26" y="74" fill="#e7e9ee" font-size="21" font-weight="700">Load the artwork</text>
      <text x="26" y="110" fill="#aeb6c6" font-size="16">Image URL or the file itself</text>
    </g>
    <g transform="translate(430 120)">
      <rect width="340" height="160" rx="16" fill="#161c28" stroke="#333c50" stroke-width="2"/>
      <text x="26" y="42" fill="#8fd9b0" font-size="14" font-weight="700">02</text>
      <text x="26" y="74" fill="#e7e9ee" font-size="21" font-weight="700">Count the dominant colors</text>
      <text x="26" y="110" fill="#aeb6c6" font-size="16">Shrunk to 64 × 64 px,</text><text x="26" y="134" fill="#aeb6c6" font-size="16">up to 15 candidates</text>
    </g>
    <g transform="translate(820 120)">
      <rect width="340" height="160" rx="16" fill="#161c28" stroke="#333c50" stroke-width="2"/>
      <text x="26" y="42" fill="#8fd9b0" font-size="14" font-weight="700">03</text>
      <text x="26" y="74" fill="#e7e9ee" font-size="21" font-weight="700">Normalize in OKLCH</text>
      <text x="26" y="110" fill="#aeb6c6" font-size="16">Lightness and chroma clamped</text><text x="26" y="134" fill="#aeb6c6" font-size="16">per mode; the hue stays</text>
    </g>
    <g transform="translate(40 320)">
      <rect width="340" height="160" rx="16" fill="#161c28" stroke="#333c50" stroke-width="2"/>
      <text x="26" y="42" fill="#8fd9b0" font-size="14" font-weight="700">04</text>
      <text x="26" y="74" fill="#e7e9ee" font-size="21" font-weight="700">Check contrast</text>
      <text x="26" y="110" fill="#aeb6c6" font-size="16">Fixed text colors; on dark,</text><text x="26" y="134" fill="#aeb6c6" font-size="16">at least 7:1 against white</text>
    </g>
    <g transform="translate(430 320)">
      <rect width="340" height="160" rx="16" fill="#161c28" stroke="#333c50" stroke-width="2"/>
      <text x="26" y="42" fill="#8fd9b0" font-size="14" font-weight="700">05</text>
      <text x="26" y="74" fill="#e7e9ee" font-size="21" font-weight="700">Fall back</text>
      <text x="26" y="110" fill="#aeb6c6" font-size="16">Muddy brown or pink is skipped;</text><text x="26" y="134" fill="#aeb6c6" font-size="16">if none fits, shift the hue</text>
    </g>
    <g transform="translate(820 320)">
      <rect width="340" height="160" rx="16" fill="#161c28" stroke="#333c50" stroke-width="2"/>
      <text x="26" y="42" fill="#8fd9b0" font-size="14" font-weight="700">06</text>
      <text x="26" y="74" fill="#e7e9ee" font-size="21" font-weight="700">Return the theme</text>
      <text x="26" y="110" fill="#aeb6c6" font-size="16">A dark and a light palette</text><text x="26" y="134" fill="#aeb6c6" font-size="16">in hex, with a page gradient</text>
    </g>
    <line x1="386" y1="200" x2="424" y2="200" stroke="#667085" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="776" y1="200" x2="814" y2="200" stroke="#667085" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M990 282 V300 H210 V316" fill="none" stroke="#667085" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="386" y1="400" x2="424" y2="400" stroke="#667085" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="776" y1="400" x2="814" y2="400" stroke="#667085" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
</svg>
